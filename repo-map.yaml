schema: 1
workspace: fastlane
owner: arlo-hello
docs:
  repository: git@github.com:arlo-hello/erp-ai-docs-arlo.git
  local_path: ../erp-ai-docs-arlo
  default_branch: main
  template_branch: template
  current_version: main
  version_branch: main
orchestration:
  repository: git@github.com:fstln-dev/erp-ai-coding.git
  local_path: ..
backend:
  repository: git@github.com:fstln-dev/erp-service-php.git
  local_path: ../erp-service-php
  version_branch: feat/v0.28.4
frontend:
  repository: git@github.com:fstln-dev/dtcplus-web-ts.git
  local_path: ../dtcplus-web-ts
  version_branch: feat/v0.28.4
handoff:
  required_fields:
    - docs_repo
    - docs_branch
    - docs_commit
    - docs_paths
  unstable_refs:
    - current workspace
    - latest files
    - uncommitted changes
  reference_fields:
    docs_head_commit: 任务分支 head commit；只代表草稿或待审版本
    docs_commit: 人工合并进版本分支后的 development input
